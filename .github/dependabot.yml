version: 2
updates:
  # A library bump also needs gradle/verification-metadata.xml regenerated, see CONTRIBUTING.md.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
