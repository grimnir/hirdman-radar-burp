name: Feature request
description: An idea that would make the plugin more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task during a test where the plugin falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you would like the plugin to behave.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Workarounds you use now, other tools that do it. No client or target domains, please.
