# Builds the jar for a v* tag, attests where it was built, and puts the jar and its .sha256
# on a draft release (or on the release that already exists for the tag).
#
# Check a downloaded jar:
#   gh attestation verify hirdman-radar-X.Y.Z.jar -R grimnir/hirdman-radar-burp
#   sha256sum -c hirdman-radar-X.Y.Z.jar.sha256
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # No build cache here: the release jar comes from a clean build with verified dependencies.
      - name: Test and build the jar
        run: >
          ./gradlew test jar --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Checksum
        working-directory: build/libs
        run: |
          JAR="hirdman-radar-${TAG#v}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::$TAG does not match the version in build.gradle.kts"
            exit 1
          fi
          sha256sum "$JAR" > "$JAR.sha256"
          cat "$JAR.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/libs/${{ env.JAR }}

      - name: Draft the release or add the files to it
        working-directory: build/libs
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" "$JAR" "$JAR.sha256" --draft --verify-tag \
              --title "Hirdman Radar ${TAG#v}" \
              --notes "SHA-256: $(cut -d' ' -f1 "$JAR.sha256")"
          elif gh release download "$TAG" --pattern "$JAR" --dir published; then
            # A jar is already attached: the build is reproducible, so it must be this one byte for byte.
            cmp "published/$JAR" "$JAR"
            gh release upload "$TAG" "$JAR.sha256" --clobber
          else
            gh release upload "$TAG" "$JAR" "$JAR.sha256"
          fi
